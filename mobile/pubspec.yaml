name: optigoai_app
description: "OptigoAI - AI Marketing Manager for SMBs"
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # HTTP Client
  http: ^1.2.0
  
  # State Management
  provider: ^6.1.0

  # Secure Storage (for JWT tokens)
  flutter_secure_storage: ^9.2.0

  # Image Caching
  cached_network_image: ^3.3.0

  # Google Fonts (Inter for typography)
  google_fonts: ^6.2.0

  # Shimmer Loading Effects
  shimmer: ^3.0.0

  # URL Launcher
  url_launcher: ^6.2.0

  # Date Formatting
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
