# ==================================================
# OptigoAI — Docker Compose (Local Development)
# ==================================================
# Usage: docker compose up --build
# ==================================================

services:
  # ---- PostgreSQL ----
  db:
    image: postgres:16-alpine
    container_name: optigoai-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-optigoai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-optigoai_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-optigoai}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-optigoai}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---- Redis ----
  redis:
    image: redis:7-alpine
    container_name: optigoai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---- FastAPI Backend ----
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: optigoai-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ---- Celery Worker ----
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: optigoai-celery-worker
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2

  # ---- Celery Beat (Scheduler) ----
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: optigoai-celery-beat
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app beat --loglevel=info

volumes:
  postgres_data:
  redis_data:
